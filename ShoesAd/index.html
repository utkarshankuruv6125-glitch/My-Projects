<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Air Max</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
</head>
<body>
        <div id="sidecolumn"> 
            <div id="logo">
                <img src="Logopic.png">
            </div>
            <div id="quote">
                <div id="mainquote">
                    <h1>STYLE TAKES OVER</h1>
                </div>
            </div>
        </div>
        <div id="mainpart"> 
            <div id="heading">
                <div id="bada">
                    <p style="font: bold; font-size: 100px; font-family: Boldonse, system-ui;font-weight: 400;font-style: normal; color:aliceblue">AIR MAX</p>
                </div><br>
                <div id="chota">
                    <p style="font: bold; font-size: 40px; font-family: sans-serif; color:aliceblue">
                        Nike Air Max 90 <br>
                        $99
                    </p>
                </div>
            </div>
            <div id="bodypart">
                <div id="discription">
                    <p style="font: bold; font-size: 15px; font-family: sans-serif; color:aliceblue">Nike Air Max shoes are ideal for everyone who are looking for both comfortable nd style. With great soles and comfortable cushioning, these shoes will keep you comfortable throughout the day.</p>
                </div>
                <img src="Shoespic.png" id="shoeimage">
            <div id="footer">
                <button id="addtocart">ADD TO CART</button>
            </div>
            <div class="lenses">
                <div id="lens1"></div>
                <div id="lens2"></div>
            </div>
        </div>
</body>
</html>
